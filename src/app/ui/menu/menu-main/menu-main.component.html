<st-nav-container [align]="align">
    <ng-content></ng-content>
    @if (!isMobile) {
        <st-nav-item
            (click)="onDiscoverClick()"
            [active]="isDiscoverActive"
            text="Discover">
        </st-nav-item>
    } @else {
        <st-nav-item routerLink="/seeds" text="Seeds"></st-nav-item>
        <st-nav-item routerLink="/gardens" text="Gardens"></st-nav-item>
    }
    <st-nav-item routerLink="/seed" text="Seed"></st-nav-item>
    <st-nav-item routerLink="/cultivate" text="Cultivate"></st-nav-item>
    @if (!isMobile) {
        <st-nav-item
            [routerLinkActiveOptions]="{exact: false}"
            routerLink="/user"
            text="Garden">
        </st-nav-item>
    }
    @if (isMobile) {
        <st-nav-item
            [routerLinkActiveOptions]="{exact: true}"
            routerLink="/user/settings"
            text="Settings">
        </st-nav-item>
    }
</st-nav-container>
